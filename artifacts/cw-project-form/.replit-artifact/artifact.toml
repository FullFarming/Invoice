kind = "web"
previewPath = "/"
title = "CW Project Creation Form"
version = "1.0.0"
id = "artifacts/cw-project-form"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22950
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/cw-project-form run dev"

[services.env]
PORT = "22950"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/cw-project-form", "run", "build"]
publicDir = "artifacts/cw-project-form/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
